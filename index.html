<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Aero Maint Logger</title>
<style>
    body { font-family: Arial; margin: 20px; }
    table { border-collapse: collapse; width: 100%; margin-top: 20px; }
    th, td { border: 1px solid #ccc; padding: 8px; }
    th { background: #eee; }
    input { margin: 5px; padding: 5px; }
</style>
</head>

<body>

<h2>Aero Maintenance Logger</h2>

<!-- FORM -->
<div>
    <label>Task: <input id="task"></label>
    <label>NO/WO: <input id="no_wo"></label>
    <label>Registration: <input id="registration"></label>
    <label>Template: <input id="template"></label>
    <label>IAW: <input id="iaw"></label>
    <label>Inspector/Lvl A/C: <input id="inspector"></label>
    <label>Hours: <input id="hours"></label>
    <button id="submit">Submit</button>
</div>

<!-- TABLE -->
<table id="logTable">
    <thead>
        <tr>
            <th>Date</th>
            <th>Task</th>
            <th>NO/WO</th>
            <th>Registration</th>
            <th>Template</th>
            <th>IAW</th>
            <th>Inspector/Lvl A/C</th>
            <th>Hours</th>
        </tr>
    </thead>
    <tbody></tbody>
</table>

<script>
// ----------------------
// DATE FORMATTER
// ----------------------
function formatDateDDMMYYYY() {
    const now = new Date();
    const day = String(now.getDate()).padStart(2, "0");
    const month = String(now.getMonth() + 1).padStart(2, "0");
    const year = now.getFullYear();
    return `${day} ${month} ${year}`;
}

// ----------------------
// LOAD CSV FROM GITHUB
// ----------------------
async function loadCSV() {
    const url = "https://raw.githubusercontent.com/AndrewC992/Logger-project/main/AeroMaintLog.csv";
    const res = await fetch(url);
    const text = await res.text();

    const rows = text.split("\n").map(r => r.split(","));
    const headers = rows[0];

    const tbody = document.querySelector("#logTable tbody");
    tbody.innerHTML = "";

    for (let i = 1; i < rows.length; i++) {
        const r = rows[i];
        if (r.length < 8) continue;

        const tr = document.createElement("tr");
        r.forEach(cell => {
            const td = document.createElement("td");
            td.textContent = cell;
            tr.appendChild(td);
        });
        tbody.appendChild(tr);
    }
}

// ----------------------
// SUBMIT HANDLER
// ----------------------
document.getElementById("submit").addEventListener("click", () => {

    const entry = {
        date: formatDateDDMMYYYY(),
        task: document.getElementById("task").value,
        no_wo: document.getElementById("no_wo").value,
        registration: document.getElementById("registration").value,
        template: document.getElementById("template").value,
        iaw: document.getElementById("iaw").value,
        inspector: document.getElementById("inspector").value,
        hours: document.getElementById("hours").value
    };

    // Add to table immediately
    const tbody = document.querySelector("#logTable tbody");
    const tr = document.createElement("tr");

    Object.values(entry).forEach(v => {
        const td = document.createElement("td");
        td.textContent = v;
        tr.appendChild(td);
    });

    tbody.appendChild(tr);

    console.log("Entry created:", entry);
    alert("Entry added (local only). To save to Google Sheets, backend required.");
});

// Load existing CSV on page load
loadCSV();
</script>

</body>
</html>
